name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.9.0"
        required: true
        default: "dev"
        type: string
      platforms:
        description: "Target platforms for a manual publish"
        required: true
        default: "linux/amd64"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      SHAREDOCK_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'dev' }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
      DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' && github.repository || '' }}
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},prefix=v,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ env.SHAREDOCK_RELEASE_TAG }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && env.SHAREDOCK_RELEASE_TAG != 'dev' }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || inputs.platforms }}
          push: true
          build-args: |
            SHAREDOCK_VERSION=${{ env.SHAREDOCK_RELEASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

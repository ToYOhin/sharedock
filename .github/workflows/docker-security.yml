---
name: Docker Security

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  IMAGE_REF: sharedock:security-scan

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        shell: bash
        run: |
          set -euo pipefail
          container="sharedock-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs "$container" || true; fi
            docker rm -fv "$container" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          docker run -d --name "$container" --cpus=2 \
            -p 127.0.0.1:3000:3000 \
            -e 'DATABASE_URL=file:../data/security-smoke.db?connection_limit=1' \
            "$IMAGE_REF"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3000/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then echo "Image did not become healthy"; exit 1; fi
          node scripts/smoke-image.mjs http://127.0.0.1:3000

      - name: Trivy SARIF report
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-sharedock.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sharedock.sarif
          category: container-sharedock

      - name: Trivy medium, high, and critical summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "0"

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
